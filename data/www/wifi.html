<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wi-Fi - CamS3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
    <!-- common.js is intentionally NOT deferred: it publishes T/esc/showToast/apiFetch
         that the inline script below relies on. i18n.js stays deferred. -->
    <script src="/common.js"></script>
    <script src="/i18n.js" defer></script>
</head>
<body>
    <div class="page">
        <div class="pg-header">
            <h1 data-i18n="wifi.title">Wi-Fi configuration</h1>
            <a href="/" class="back-link" data-i18n="nav.back">Back</a>
        </div>

        <nav class="nav-tabs" aria-label="Main" data-i18n-aria-label="aria.nav">
            <a href="/"              class="nav-tab"        data-i18n="nav.overview">Overview</a>
            <a href="/settings.html" class="nav-tab"        data-i18n="nav.settings">Settings</a>
            <a href="/zones.html"    class="nav-tab"        data-i18n="nav.zones">Zones</a>
            <a href="/wifi.html"     class="nav-tab active" aria-current="page" data-i18n="nav.wifi">Wi-Fi</a>
            <a href="/admin.html"    class="nav-tab"        data-i18n="nav.admin">Admin</a>
            <a href="/gallery.html"  class="nav-tab"        data-i18n="nav.gallery">Gallery</a>
        </nav>

        <!-- Current status -->
        <div class="card" style="margin-bottom:20px">
            <div class="card-body">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                    <span style="font-weight:600;color:#fff" data-i18n="wifi.current">Current connection</span>
                    <span class="status-badge" id="wifi-status">
                        <span class="status-dot" id="wifi-dot"></span>
                        <span id="wifi-mode">--</span>
                    </span>
                </div>
                <div class="info-grid" style="margin-bottom:0">
                    <div class="info-card"><div class="label" data-i18n="wifi.ip">IP</div><div class="value" id="wifi-ip">--</div></div>
                    <div class="info-card"><div class="label" data-i18n="wifi.rssi">RSSI</div><div class="value" id="wifi-rssi">--</div></div>
                    <div class="info-card"><div class="label" data-i18n="wifi.mac">MAC</div><div class="value" id="wifi-mac" style="font-size:.75em">--</div></div>
                    <div class="info-card"><div class="label" data-i18n="wifi.hostname">Hostname</div><div class="value" id="wifi-hostname">--</div></div>
                </div>
            </div>
        </div>

        <!-- Scan networks -->
        <div class="card">
            <div class="card-body">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                    <span style="font-weight:600;color:#fff" data-i18n="wifi.scan.title">Available networks</span>
                    <button class="btn btn-outline btn-sm" onclick="scanNetworks()" data-i18n="common.scan">Scan</button>
                </div>
                <div id="network-list" style="color:var(--text-muted);font-size:.9em" data-i18n="wifi.scan.hint">
                    Click "Scan" to load networks
                </div>
            </div>
        </div>

        <!-- Manual connect -->
        <details style="margin-top:12px">
            <summary><span class="sec-color" style="background:var(--accent)"></span> <span data-i18n="wifi.manual.title">Manual connect</span></summary>
            <div class="sec-body">
                <div class="fg">
                    <label for="manual-ssid" data-i18n="wifi.manual.ssid">SSID</label>
                    <input type="text" id="manual-ssid" data-i18n-placeholder="wifi.manual.ssid.ph" placeholder="Network name">
                </div>
                <div class="fg">
                    <label for="manual-pass" data-i18n="wifi.manual.pass">Password</label>
                    <input type="password" id="manual-pass" data-i18n-placeholder="wifi.manual.pass.ph" placeholder="Network password">
                </div>
                <button class="btn btn-primary btn-block" onclick="connectManual()" data-i18n="common.connect">Connect</button>
            </div>
        </details>
    </div>

    <div id="toast" class="toast"></div>

    <script>
    // T() / escapeHtml() / showToast() come from common.js.
    function loadStatus() {
        fetch('/api/status', { credentials: 'same-origin' }).then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }).then(d => {
            document.getElementById('wifi-ip').textContent       = d.ip || '--';
            document.getElementById('wifi-rssi').textContent     = d.rssi ? d.rssi + ' dBm' : 'N/A';
            document.getElementById('wifi-mac').textContent      = d.mac || '--';
            document.getElementById('wifi-hostname').textContent = d.hostname || '--';
            document.getElementById('wifi-mode').textContent     = d.wifi_mode || '--';
            const dot = document.getElementById('wifi-dot');
            dot.className = 'status-dot' + (d.wifi_mode === 'STA' ? '' : ' warning');
        }).catch(() => {
            // Previously an unhandled rejection: the page just showed "--" forever.
            document.getElementById('wifi-mode').textContent = T('common.offline');
            document.getElementById('wifi-dot').className = 'status-dot error';
        });
    }

    function scanNetworks() {
        const list = document.getElementById('network-list');
        list.textContent = '';
        list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted)">' +
            escapeHtml(T('wifi.scan.searching')) + '</div>';

        fetch('/api/wifi/scan').then(r => r.json()).then(networks => {
            if (!networks.length) {
                list.innerHTML = '<div style="padding:12px;color:var(--text-muted)">' +
                    escapeHtml(T('wifi.scan.none')) + '</div>';
                return;
            }
            list.innerHTML = '';
            networks.sort((a, b) => b.rssi - a.rssi);
            networks.forEach(n => {
                const strength = n.rssi > -50 ? T('wifi.strength.excellent')
                                : n.rssi > -70 ? T('wifi.strength.good')
                                               : T('wifi.strength.weak');
                const lock = n.enc ? '\uD83D\uDD12' : '\uD83D\uDD13';

                const row = document.createElement('div');
                row.className = 'file-item';
                row.style.cursor = 'pointer';
                row.addEventListener('click', () => selectNetwork(n.ssid));

                const info = document.createElement('div');
                const name = document.createElement('div'); name.className = 'file-name';
                name.textContent = lock + ' ' + n.ssid;
                const size = document.createElement('div'); size.className = 'file-size';
                // En-dash as a parenthetical separator, per Czech typography (ČSN 01 6910).
                size.textContent = n.rssi + ' dBm – ' + strength;
                info.appendChild(name); info.appendChild(size);

                const btn = document.createElement('button');
                btn.className = 'btn btn-outline btn-sm';
                btn.textContent = T('common.connect');
                btn.addEventListener('click', e => { e.stopPropagation(); selectNetwork(n.ssid); });

                row.appendChild(info); row.appendChild(btn);
                list.appendChild(row);
            });
        }).catch(() => {
            list.innerHTML = '<div style="padding:12px;color:var(--red)">' +
                escapeHtml(T('wifi.scan.error')) + '</div>';
        });
    }

    function selectNetwork(ssid) {
        document.getElementById('manual-ssid').value = ssid;
        document.getElementById('manual-pass').value = '';
        document.getElementById('manual-pass').focus();
        document.querySelector('details').open = true;
    }

    function connectManual() {
        const ssid = document.getElementById('manual-ssid').value;
        const pass = document.getElementById('manual-pass').value;
        if (!ssid) { showToast(T('wifi.manual.ssid.required'), 'error'); return; }

        showToast(T('wifi.connecting.to') + ' ' + ssid + '...', 'info');

        apiFetch('/api/wifi', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ssid: ssid, password: pass})
        })
        .then(r => r.json())
        .then(result => {
            showToast(result.message, result.success ? 'success' : 'error');
            if (result.success) {
                setTimeout(() => { showToast(T('wifi.connecting.note'), 'info'); }, 2000);
            }
        })
        .catch(() => showToast(T('common.offline'), 'error'));
    }

    loadStatus();
    </script>
</body>
</html>

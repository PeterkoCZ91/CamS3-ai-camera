; CamS3 5MP Advanced Camera Firmware
; Target: M5Stack Unit CamS3 5MP (ESP32-S3-WROOM-1-N16R8)
; Sensor: PY260 (OV5640 derivative), 5MP

[env:m5stack-cams3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; Flash & PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Monitor
monitor_speed = 115200
monitor_filters = direct

; Upload
upload_speed = 460800

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFIRMWARE_VERSION='"1.0.0"'
    -DDEVICE_NAME='"CamS3-5MP"'
    ; ElegantOTA: use ESPAsyncWebServer instead of WebServer
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    ; Feature flags - comment out to disable
    -DINCLUDE_SD_CARD
    -DINCLUDE_MOTION_DETECT
    -DINCLUDE_TIMELAPSE
    -DINCLUDE_OTA
    -DINCLUDE_MDNS
    -DINCLUDE_LED_CONTROL
    -DINCLUDE_MQTT
    -DINCLUDE_FACE_DETECT
    -DINCLUDE_TELEGRAM
    ; Uncomment to enable LITE_MODE (skips timelapse/face tasks, saves ~12KB SRAM)
    ; -DLITE_MODE
    ; Uncomment after adding Edge Impulse FOMO library to lib/ei-person-detection-fomo/
    ; -DINCLUDE_PERSON_DETECT

; Libraries
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    esp32async/ESPAsyncWebServer@^3.7.3
    ayushsharma82/ElegantOTA@^3.1.7
    256dpi/MQTT@^2.5.2

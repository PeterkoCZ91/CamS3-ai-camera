; CamS3 5MP Advanced Camera Firmware
; Target: M5Stack Unit CamS3 5MP (ESP32-S3-WROOM-1-N16R8)
; Sensor: PY260 (OV5640 derivative), 5MP

[platformio]
; `pio run` builds only the real firmware; the ci env is opt-in with `-e ci`.
default_envs = m5stack-cams3

[env:m5stack-cams3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Flash & PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Build-time gzip of data/www before the LittleFS image is built.
; The sources stay uncompressed; the script stages a copy under
; $BUILD_DIR/fsdata, gzips the text assets there and repoints
; PROJECT_DATA_DIR at it. Only runs for buildfs/uploadfs targets.
extra_scripts = pre:tools/gzip_www.py

; Monitor
monitor_speed = 115200
monitor_filters = direct

; Upload
upload_speed = 460800

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFIRMWARE_VERSION='"2.1.0"'
    -DDEVICE_NAME='"CamS3-5MP"'
    ; ElegantOTA: use ESPAsyncWebServer instead of WebServer
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    ; Feature flags - comment out to disable
    -DINCLUDE_SD_CARD
    -DINCLUDE_MOTION_DETECT
    -DINCLUDE_TIMELAPSE
    -DINCLUDE_OTA
    -DINCLUDE_MDNS
    -DINCLUDE_LED_CONTROL
    -DINCLUDE_MQTT
    ; Face detection CANNOT be enabled on this core (arduino-esp32 3.3.x): the
    ; build stops at an #error, see docs/known_issues.md §1 and §12. Historically
    ; it was off by default for two independent reasons:
    ;   1. esp-dl's HumanFaceDetectMSR01 is deprecated — arduino-esp32 removed the
    ;      headers in v3.1+, so core 2.0.17 is the last one where it compiles.
    ;   2. It costs ~660 kB of flash (67.1 % vs 45.9 % of the app partition).
    ; A LoadStoreError panic was also observed on this hardware with it enabled
    ; (see docs/known_issues.md) — that report has not been re-verified since.
    ; The code is kept (src/face_detect.cpp) for a future port.
    ; Path forward: a FOMO face model via the same Edge Impulse pipeline already used
    ; for person detection. See docs/known_issues.md.
    ; -DINCLUDE_FACE_DETECT
    -DINCLUDE_TELEGRAM
    ; Uncomment to enable LITE_MODE (skips timelapse/face tasks, saves ~12KB SRAM)
    ; -DLITE_MODE
    ; Person detection task (FOMO model goes in lib/ei-person-fomo/)
    -DINCLUDE_PERSON_DETECT
    ; Detection zones (zone_manager.cpp) — requires INCLUDE_MOTION_DETECT
    -DINCLUDE_ZONES
    ; In-memory + LittleFS event log (event_log.cpp)
    -DINCLUDE_EVENT_LOG
    ; AVI muxer (avi_writer.cpp). Compiles the RIFF/AVI writer, but nothing drives
    ; it yet — there is no recorder task and POST /record returns 501.
    -DINCLUDE_AVI_WRITER

; LDF: plain `chain` (the default), NOT deep+. On arduino-esp32 3.x, WiFi.h and
; AsyncTCP include Network.h inside `#if SOC_WIFI_SUPPORTED`; deep+ evaluates that
; condition without sdkconfig.h, takes it as false and never pulls in the Network
; library ("Network.h: No such file"). chain scans every #include regardless of
; #if, which also finds the EI FOMO library through the direct include in
; src/person_detection.cpp. The ci env lib_ignores that library instead.
lib_ldf_mode = chain

; Libraries — exact pins, built and checked against arduino-esp32 3.3.9. A floating
; range let ESPAsyncWebServer/AsyncTCP move under us between builds; AsyncTCP is
; listed explicitly so its version is pinned too instead of following
; ESPAsyncWebServer's own "^3.5.0".
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    esp32async/AsyncTCP@3.6.1
    esp32async/ESPAsyncWebServer@3.12.1
    ayushsharma82/ElegantOTA@3.1.7
    256dpi/MQTT@2.5.3

; ── CI environment ───────────────────────────────────────────────────────────
; Same firmware, minus person detection. The Edge Impulse FOMO export is not in
; this repository (see docs/fomo_setup.md), so a build that needs it cannot run on
; a clean checkout. This env compiles everything else — ~90 % of the codebase,
; including all the shared headers and every other feature flag — so CI still
; catches type and syntax regressions on a fresh clone.
[env:ci]
extends = env:m5stack-cams3
; chain LDF sees the EI include even with INCLUDE_PERSON_DETECT off; without this
; a checkout that has the model would compile the 24 MB SDK for nothing.
lib_ignore = Person_detection_FOMO_inferencing
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFIRMWARE_VERSION='"2.1.0-ci"'
    -DDEVICE_NAME='"CamS3-5MP"'
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DINCLUDE_SD_CARD
    -DINCLUDE_MOTION_DETECT
    -DINCLUDE_TIMELAPSE
    -DINCLUDE_OTA
    -DINCLUDE_MDNS
    -DINCLUDE_LED_CONTROL
    -DINCLUDE_MQTT
    -DINCLUDE_TELEGRAM
    -DINCLUDE_ZONES
    -DINCLUDE_EVENT_LOG
    -DINCLUDE_AVI_WRITER
